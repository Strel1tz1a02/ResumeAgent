[project]
name = "resume-matcher-evals"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "langfuse>=3.0,<5",
  "deepeval>=3,<4",
  "httpx>=0.28,<1",
  "python-dotenv>=1.2,<2",
]

[project.scripts]
evals = "evaluation.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluation"]

[tool.pytest.ini_options]
pythonpath = ["src"]
